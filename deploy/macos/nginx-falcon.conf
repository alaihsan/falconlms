# Falcon LMS site for Nginx (Homebrew) on the school Mac mini.
# Copy to /opt/homebrew/etc/nginx/servers/falcon.conf and adjust server_name.

server {
    listen 80;
    server_name falcon.sekolah.lan;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name falcon.sekolah.lan;

    # Certificate issued by the school's internal CA (see docs/INSTALL-MACOS.md).
    ssl_certificate     /opt/falcon/shared/tls/falcon.crt;
    ssl_certificate_key /opt/falcon/shared/tls/falcon.key;

    root /opt/falcon/current/public;
    index index.php;
    charset utf-8;

    # A 100 MB file plus the rest of the form (post_max_size in php-fpm-falcon.conf).
    client_max_body_size 110m;

    # Smaller responses help when hundreds of students share the school Wi-Fi.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Built assets have hashed file names, so browsers may keep them for a long time.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Files are sent by Nginx after Falcon has checked access
    # (FALCON_X_ACCEL_REDIRECT=/_protected). Browsers cannot open this path directly.
    location /_protected/ {
        internal;
        alias /opt/falcon/shared/storage/app/private/;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        # $realpath_root resolves the /opt/falcon/current symlink, so a new release is picked up right away.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
