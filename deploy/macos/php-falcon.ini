; Falcon LMS PHP settings on the school Mac mini.
; Copy to /opt/homebrew/etc/php/8.4/conf.d/falcon.ini

date.timezone = Asia/Jakarta
expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Code only changes when a release is installed, and the install script
; restarts PHP-FPM, so PHP does not need to check files for changes.
opcache.validate_timestamps = 0
