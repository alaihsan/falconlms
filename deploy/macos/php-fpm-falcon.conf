; Falcon LMS PHP-FPM pool on the school Mac mini.
; Replace /opt/homebrew/etc/php/8.4/php-fpm.d/www.conf with this file.

[www]
user = falcon
group = staff
listen = 127.0.0.1:9000

; RAM is the limit on the 8 GB Mac mini (docs/AUDIT.md §3.8). A worker uses
; about 50 MB, so 28 workers take roughly 1.4 GB. A static pool avoids
; spawning workers at the exact moment 450 students open an exam.
; Adjust after the load test.
pm = static
pm.max_children = 28
pm.max_requests = 1000

request_terminate_timeout = 120s

php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 100M
php_admin_value[post_max_size] = 110M
